<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <script src="functions.js" defer></script>
    <title>Alexia & Nathan</title>
</head>
<body>
    <!-- The overlay -->
    <div id="myNav" class="overlayMenu">
        <!-- Button to close the overlay navigation -->
        <a class="closebtn" onclick="closeNav()">&times;</a>

        <!-- Overlay content -->
        <div class="overlay-content-menu">
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Clients</a>
            <a href="#">Contact</a>
        </div>
    </div>


    <div class="logo-nav">
        <span class="menu-icon" onclick="openNav()">&#9776;</span>
        <span class="logo">
             <a href="index.html">
                <img style="width: 10vw" src="images/initials.svg" alt="Logo">
            </a>
        </span>
        <span></span>
    </div>

    <div class="elemSlideshowContainer">
        <div class="mySlides fade">
            <img class="slideshowImage" src="images/img_1.jpg" alt="slideshowImg1">
        </div>

        <div class="mySlides fade">
            <img class="slideshowImage" src="images/img_6.jpg" alt="slideshowImg2">
        </div>

        <div class="mySlides fade">
            <img class="slideshowImage" src="images/img_11.jpg" alt="slideshowImg2">
        </div>

        <div class="overlay">
            <div class="elemSlideshowOverlayTextContainer">
              <p class="elemSlideShowOverlayText">Join Us On Our Wedding Day</p>
              <p class="elemSlideShowOverlayText" style="font-size: 90px; width: 90%">Alexia & Nathan</p>
            </div>
        </div>
    </div>

    <div>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

    <div class="elemMainContainer">
        <div class="elemContentContainer">
            <div class="elemContentImageContainer">
                <img class="elemImages" src="images/img_5.jpg" alt="rec">
            </div>

            <div class="elemContentTextContainer">
                <div class="elemTextContainer">
                    <p class="textHeader">Ceremony</p>
                    <img style="width: 80px" src="images/cer1.svg" alt="ceremony_icon">
                    <div style="display:flex; flex-direction: column; align-items: center">
                        <p class="textContent">03/04/2027</p>
                        <p class="textContent">15:00</p>
                        <p class="textContent">Knisja tal-Vittorja, Belt Valletta</p>
                    </div>

                    <button class="mapButton" onclick="window.open('https://maps.app.goo.gl/qMgsDKDKtJGqZ39z7', '_blank')">
                        Get Directions
                    </button>
                    <!-- <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1113.6623524415709!2d14.510873921382395!3d35.895849936335686!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x130e452cd089ab0f%3A0xda8f18016f7361bf!2sKnisja%20tal-Vittorja!5e1!3m2!1sen!2smt!4v1791385715011!5m2!1sen!2smt" width="400" height="400" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe> -->
                </div>
            </div>
        </div>

        <div class="elemContentContainer" style="margin-top: 30px;">
            <div class="elemContentTextContainer">
                <div class="elemTextContainer">
                    <p class="textHeader">Reception</p>
                    <img style="width: 80px" src="images/rec1.svg" alt="reception_icon">
                    <div style="display:flex; flex-direction: column; align-items: center">
                        <p class="textContent">03/04/2027</p>
                        <p class="textContent">18:00</p>
                        <p class="textContent">Villa Arrigo, Naxxar</p>
                    </div>

                    <!-- <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d802.5303361924874!2d14.441422214805321!3d35.92121008217035!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x130e4fc6eaa0628f%3A0xac19fe7b799a5e89!2sVilla%20Arrigo%20Hall!5e1!3m2!1sen!2smt!4v1791112151410!5m2!1sen!2smt" width="400" height="400" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe> -->
                    <button class="mapButton" onclick="window.open('https://maps.app.goo.gl/YbNh2C58nb9FpanN9', '_blank')">
                        Get Directions
                    </button>
                </div>
            </div>
            <div class="elemContentImageContainer">
                <img class="elemImages" src="images/img_3.jpg" alt="rec">
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footerImageContainer">
          <img class="footerImage" src="images/img_10.jpg" alt="Background image">

          <div class="overlay">
            <div class="overlay-content">
              <p class="overlayText">Celebrate our Special Day with us</p>
            </div>
          </div>
        </div>
    </div>
</body>
</html>
